<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>artvault</title>
      <style>
.art-item {


}
.art-item h3 {
      color:red
}
.art-item p {
      color: blue

}
.art-item .image {
      height: 200px;
      width: 400px;
      background-size:cover
}

      
      </style>
      <link href="css/style.css" rel="stylesheet">
</head>

<body>

      {% for a in art %}
      <div class=art-item>
            <h3>{{a.id}}</h3>
            <p>{{a.title}}</p>

            <div class="image" style="background-image: url({{ a.image_path }})">
                  
            </div>
      </div>

      {% endfor %}
</body>

</html>

{% extends 'base.html' %}

{% block content %}

<div class="checkout-page">
    <div class="checkout-layout">
        <div class="checkout-main">

            <form method="post" class="wire-form">
                {% csrf_token %}

                <h1>Wire transfer</h1>

                <div class="wire-field">
                    <label>Name of sending bank</label>
                    {{ form.sending_bank }}
                </div>

                <div class="wire-field">
                    <label>Routing number</label>
                    {{ form.routing_number }}
                </div>

                <div class="wire-field">
                    <label>Account number</label>
                    {{ form.account_number }}
                </div>

                 <div class="checkout-buttons">
                    <a href="{% url 'payment_method' shipping.id %}" class="button button-orange">Back</a>
                    <button type="submit" class="button button-orange">Confirm</button>
                </div>

            </form>

        </div>
        {% include "bids/component/order_summary.html" %}
    </div>

</div>

{% endblock content %}

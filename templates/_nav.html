{% load static %}

<nav class="nav-container">
        <div class="left-side">
          <div class="dropdown">
            <button onclick="leftDropdown()" class="dropbtn" type="button">
              <img src="{% static 'img/HamburgerMenu.svg' %}" alt="Menu button">
            </button>

            <div id="leftDropdown" class="dropdown-content left-dropdown-content">
                {% if user.is_authenticated %}
                  <a href="#">View Artist</a>
                  <a href="#">View Artwork</a>
                  <a href="#">My Bids</a>
                {% else %}
                  <a href="#">View Artist</a>
                  <a href="#">View Artwork</a>
                {% endif %}
            </div>
          </div>

          <a href="{% url 'artvault-browse-artwork' %}" class="browse">Browse Artwork</a>
        </div>

        <div class="logo">
          <a href="{% url 'home' %}">
            <img src="{% static 'img/artVaultLogo.png' %}" alt="ArtVault logo">
          </a>
        </div>

        <div class="right-side">
            {% if user.is_authenticated %}

            <div class="profile-dropdown">
                <button onclick="rightDropdown()" class="dropbtn" type="button">
                    {% if user.profile.role == "buyer" %}
                        <div class="avatar" style="background-image: url({{ user.profile.buyerprofilemodel.profile_image }})"></div>
                    {% else %}
                        <div class="avatar" style="background-image: url({{ user.profile.sellerprofilemodel.logo }})"></div>
                    {% endif %}
                </button>
            </div>

                <div id="rightDropdown" class="dropdown-content right-dropdown-content">
                    <a href="#">Account settings</a>
                    <a href="#">My Bids</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="logOutButton">Logout</button>
                    </form>
                </div>
                {% else %}
                    <a class="signup" href="{% url 'signup' %}">Signup</a>
                    <a class="login" href="{% url 'login' %}">Login</a>
                {% endif %}
        </div>
      </nav>

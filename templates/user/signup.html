{% extends "base.html" %}

{% block content %}
    <div class="signup-container">
        <h1>Signup!</h1>

        <form method="post" class="signup-form">
            {% csrf_token %}

            {{ form.role }}

            {{ form.username }}
            {{ form.password1 }}
            {{ form.password2 }}

            <button type="submit" class="confirm-btn">Confirm</button>
        </form>
    </div>

{% endblock %}

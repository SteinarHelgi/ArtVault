{% extends "base.html" %}

{% block content %}
<div class="login-page">
    <h1>Login</h1>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username...">
        <input type="password" name="password" placeholder="Password...">

        <button type="submit">Confirm</button>
    </form>
</div>
{% endblock %}

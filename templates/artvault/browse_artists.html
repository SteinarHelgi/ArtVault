{% extends "base.html" %}

{% block content %}
<div class="gallery-section">
    <div class="gallery-header">
            <h2>View Artists</h2>
    </div>
    <div class="gallery-container">
        {% for artist_name, artworks in artists.items %}
                    {% for a in artworks %}
                    <a href="{% url 'artwork-details' a.id %}" class="art-card">
                          {% with img=a.images.first %}
                          {% if img %}
                              <img class="image" src="{{ img.image.url }}" alt="image of artwork from artist">
                          {% endif %}
                          {% endwith %}

                         <div class="art-card-info">
                            <h5 class="art-movement-h1">{{ artist_name }}</h5>
                         </div>
                    </a>
                    {% endfor %}
        {% endfor %}
    </div>
</div>

{% endblock %}

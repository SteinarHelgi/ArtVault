{% load static %}

<div class="bid-card">
    <h3 class="highest-bid">Highest bid</h3>
    <h2 class="bid-price">{{ current_price }} Kr.</h2>

    <form method="post" action="{% url 'make_bid' artwork.id %}">
        {% csrf_token %}
            {% if messages %}
            {% for message in messages %}
                  <div class="bid-text">
                        {{ message }}
                  </div>
            {% endfor %}
            {% endif %}
        <div class="bid-text">
            <p>Bid has to be 10% over highest bid</p>
        </div>

        <label for="bid-amount">
            <input type="number" step="1" name="amount" class="bid-amount-input" placeholder="Amount..." min="{{ minimum_bid }}" required>
        </label>

        <button type="submit" class="button-bid">Submit</button>
    </form>

</div>

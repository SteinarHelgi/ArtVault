{% extends "../base.html" %}

{% block content %}
    {% for a in art %}
        <div class="art-details">
            <h1>{{a.title}}</h1>
            <img src={{ a.image_path }}, alt="image of artwork">
            <h2>{{ a.artist_name }}</h2>
            <p>{{ a.history }}</p>
        </div>

    {% endfor %}
{% endblock %}
